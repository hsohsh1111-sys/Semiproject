name: onfit-ajb

services:
  api:
    build:
      context: .
      dockerfile: deploy/ec2/Dockerfile.api
    env_file:
      - ./deploy/ec2/.env
    expose:
      - "8000"
    init: true
    shm_size: "128m"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: deploy/ec2/Dockerfile.web
      args:
        VITE_API_BASE_URL: /api
    volumes:
      - ./deploy/ec2/nginx.onfit.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  duckdns:
    image: curlimages/curl:8.12.1
    entrypoint: ["/bin/sh", "/tmp/duckdns-update.sh"]
    env_file:
      - ./deploy/ec2/.env.duckdns
    environment:
      DUCKDNS_DOMAIN: onfit-ajb
    volumes:
      - ./deploy/ec2/duckdns-update.sh:/tmp/duckdns-update.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/duckdns-ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/ec2/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
      duckdns:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
