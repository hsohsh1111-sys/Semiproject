name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onfit-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Configure SSH
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_ENV_FILE: ${{ secrets.EC2_ENV_FILE }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST" || { echo "Missing EC2_HOST secret"; exit 1; }
          test -n "$EC2_USER" || { echo "Missing EC2_USER secret"; exit 1; }
          test -n "$EC2_SSH_PRIVATE_KEY" || { echo "Missing EC2_SSH_PRIVATE_KEY secret"; exit 1; }
          test -n "$EC2_ENV_FILE" || { echo "Missing EC2_ENV_FILE repository secret"; exit 1; }

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$HOME/.ssh/onfit_ec2"
          chmod 600 "$HOME/.ssh/onfit_ec2"
          ssh-keyscan -T 15 -H "$EC2_HOST" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts" || { echo "Could not read SSH host key from EC2_HOST"; exit 1; }
          chmod 600 "$HOME/.ssh/known_hosts"

          printf '%s' "$EC2_ENV_FILE" | ssh -i "$HOME/.ssh/onfit_ec2" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            'set -eu
             sudo -n install -d -o "$USER" -g "$USER" -m 0750 /srv/onfit
             sudo -n install -o root -g root -m 0600 /dev/null /tmp/onfit.env
             trap "sudo -n rm -f /tmp/onfit.env" EXIT
             sudo -n tee /tmp/onfit.env >/dev/null
             sudo -n chmod 0600 /tmp/onfit.env
             if [ ! -d /srv/onfit/app/.git ]; then
               git clone --branch main https://github.com/hsohsh1111-sys/Semiproject.git /srv/onfit/app
             fi
             cd /srv/onfit/app
             git remote set-url origin https://github.com/hsohsh1111-sys/Semiproject.git
             git fetch --prune origin main
             git reset --hard origin/main
             sudo -n install -d -m 0755 /var/www/certbot
             if [ -L /etc/nginx/sites-enabled/default ]; then
               sudo -n unlink /etc/nginx/sites-enabled/default
             fi
             if [ -s /etc/letsencrypt/live/onfit3.duckdns.org/fullchain.pem ]; then
               sudo -n install -m 0644 deploy/ec2/nginx.conf.example /etc/nginx/sites-available/onfit
             else
               sudo -n install -m 0644 deploy/ec2/nginx.bootstrap.conf /etc/nginx/sites-available/onfit
             fi
             sudo -n ln -sfn /etc/nginx/sites-available/onfit /etc/nginx/sites-enabled/onfit
             sudo -n nginx -t
             sudo -n systemctl reload nginx
             sudo -n docker compose --env-file /tmp/onfit.env -f deploy/ec2/compose.yaml up -d --build --remove-orphans
             sudo -n docker compose --env-file /tmp/onfit.env -f deploy/ec2/compose.yaml ps
             curl -fsS http://127.0.0.1:8080/health
             if [ ! -s /etc/letsencrypt/live/onfit3.duckdns.org/fullchain.pem ]; then
               sudo -n apt-get update
               sudo -n apt-get install -y certbot python3-certbot-nginx
               sudo -n certbot certonly --webroot -w /var/www/certbot --non-interactive --agree-tos --register-unsafely-without-email -d onfit3.duckdns.org
               sudo -n install -m 0644 deploy/ec2/nginx.conf.example /etc/nginx/sites-available/onfit
               sudo -n install -d -m 0755 /etc/letsencrypt/renewal-hooks/deploy
               printf "#!/bin/sh\nsystemctl reload nginx\n" | sudo -n tee /etc/letsencrypt/renewal-hooks/deploy/reload-nginx >/dev/null
               sudo -n chmod 0755 /etc/letsencrypt/renewal-hooks/deploy/reload-nginx
             fi
             sudo -n nginx -t
             sudo -n systemctl reload nginx
             curl --noproxy "*" -fsS --resolve onfit3.duckdns.org:443:127.0.0.1 https://onfit3.duckdns.org/health'
