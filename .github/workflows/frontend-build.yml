name: Frontend build

on:
  push:
    paths:
      - "frontend/**"
      - "ai-fashion/**"
      - "scripts/build-site.mjs"
      - "deploy/ec2/Dockerfile.web"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "ai-fashion/**"
      - "scripts/build-site.mjs"
      - "deploy/ec2/Dockerfile.web"
      - ".github/workflows/frontend-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix frontend
      - run: npm ci --prefix ai-fashion
      - run: npm run build:site --prefix frontend
