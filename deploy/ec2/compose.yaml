services:
  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file:
      - ${ONFIT_ENV_FILE:-/srv/onfit/.env}
    environment:
      APP_ENV: production
    command:
      - sh
      - -c
      - exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ../..
      dockerfile: deploy/ec2/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
