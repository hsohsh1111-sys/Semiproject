server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    location /api/ {
        # Keep the /api prefix when forwarding to FastAPI.
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /health {
        proxy_pass http://api:8000;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /assets/ { try_files $uri =404; }
    location /models/ { try_files $uri =404; }
    location /textures/ { try_files $uri =404; }

    # Direct visits use the integrated React page; nested assets remain available.
    location = /ai-fashion { try_files /index.html =404; }
    location = /ai-fashion/ { try_files /index.html =404; }
    location /ai-fashion/ { try_files $uri /index.html; }
    location / { try_files $uri $uri/ /index.html; }
}
